name: wm2
channels:
  - defaults
dependencies:
  - python=3.10.21
  - pip
  - pip:
      # PyTorch CUDA 版(必须走 pytorch 官方 cu124 源,先于下面其余依赖执行):
      #   pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu124
      # 验证: python -c "import torch; print(torch.cuda.is_available())"  必须为 True
      - --index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - torchvision==0.20.1+cu124
      # WAM (watermark-anything) requirements.txt 原版依赖:
      - omegaconf==2.3.0
      - einops==0.8.0
      - pycocotools==2.0.8
      - timm==1.0.11
      - opencv-python==4.10.0.84
      - lpips==0.1.4
      - scikit-image==0.24.0
      - scikit-learn==1.5.2
      # 传递依赖(实测锁定版本,可由 pip 自动解析):
      - numpy==2.2.6
      - pillow==12.3.0
      - sympy==1.13.1
      - networkx==3.4.2
      - jinja2==3.1.6
      - fsspec==2026.7.0
      - filelock==3.32.3
      - typing-extensions==4.16.0
      - MarkupSafe==3.0.3
      - mpmath==1.3.0
      # WebUI 后端:
      - fastapi
      - uvicorn
      - python-multipart
